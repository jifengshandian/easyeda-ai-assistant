<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 原理图助手</title>
    <style>
        :root {
            --bg-app: #f0f2f5;
            --bg-panel: #ffffff;
            --bg-input: #f5f5f5;
            --bg-hover: #e8eaed;
            --bg-active: #d3d7dc;
            --border-color: #dcdfe6;
            --accent-color: #1976d2;
            --accent-hover: #1565c0;
            --accent-light: #e3f2fd;
            --text-primary: #303133;
            --text-secondary: #909399;
            --text-placeholder: #c0c4cc;
            --msg-user-bg: #e3f2fd;
            --msg-user-text: #1a237e;
            --msg-ai-bg: #f5f5f5;
            --success-color: #67c23a;
            --warning-color: #e6a23c;
            --error-color: #f56c6c;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --radius-sm: 2px;
            --radius-md: 4px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            font-size: 13px;
            color: var(--text-primary);
            background: var(--bg-app);
            height: 100vh;
            display: flex;
            overflow: hidden;
            line-height: 1.5;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c0c4cc; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #909399; }

        #sidebar {
            width: 220px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: margin-left 0.2s;
        }
        #sidebar.collapsed { margin-left: -220px; }

        .sidebar-header {
            height: 40px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-title { font-size: 14px; font-weight: 600; }

        .sidebar-content { flex: 1; padding: 10px; overflow-y: auto; }

        .info-section { margin-bottom: 12px; }
        .info-label {
            color: var(--text-secondary);
            font-size: 11px;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .info-value {
            background: var(--bg-input);
            padding: 5px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-family: Consolas, monospace;
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 3px;
        }

        .btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            font-size: 12px;
            color: #fff;
            background: var(--accent-color);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s;
            height: 30px;
            font-family: inherit;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary {
            background: var(--bg-panel);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background: var(--bg-hover); }

        .history-section {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
        .history-label {
            color: var(--text-secondary);
            font-size: 11px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .history-list { max-height: 200px; overflow-y: auto; }
        .history-item {
            padding: 6px 8px;
            margin-bottom: 4px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            color: var(--text-primary);
            transition: all 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item:hover { background: var(--bg-hover); border-color: var(--accent-color); }
        .history-item.active { background: var(--accent-light); border-color: var(--accent-color); color: var(--accent-color); }
        .history-empty { color: var(--text-placeholder); font-size: 11px; text-align: center; padding: 10px; }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-app);
            min-width: 0;
        }

        .chat-header {
            height: 40px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
        }
        .header-debug-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            line-height: 1;
            transition: all 0.2s;
        }
        .header-debug-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }
        .toggle-sidebar {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
        }
        .toggle-sidebar:hover { background: var(--bg-hover); color: var(--text-primary); }

        .status-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-secondary); }
        .status-dot.ready { background: var(--success-color); }
        .status-dot.thinking { background: var(--warning-color); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message { display: flex; gap: 8px; max-width: 85%; animation: slideIn 0.2s ease; }
        @keyframes slideIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai { align-self: flex-start; }

        .message-avatar {
            width: 26px; height: 26px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 11px; font-weight: 600;
            border: 1px solid var(--border-color);
        }
        .message.user .message-avatar { background: var(--accent-light); color: var(--accent-color); }
        .message.ai .message-avatar { background: var(--accent-color); color: #fff; }

        .message-body { flex: 1; min-width: 0; }

        .message-content {
            padding: 8px 12px;
            border-radius: var(--radius-md);
            font-size: 13px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.user .message-content { background: var(--msg-user-bg); color: var(--msg-user-text); border-top-right-radius: 0; }
        .message.ai .message-content { background: var(--msg-ai-bg); border: 1px solid var(--border-color); border-top-left-radius: 0; }

        .message-content p { margin-bottom: 6px; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content code {
            background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 2px;
            font-family: Consolas, Monaco, monospace; font-size: 12px; color: #c7254e;
        }
        .message-content pre {
            background: #f8f8f8; border: 1px solid var(--border-color);
            padding: 8px; border-radius: var(--radius-sm); overflow-x: auto; margin: 6px 0;
        }
        .message-content pre code { background: none; padding: 0; color: inherit; }

        .ref-tag {
            display: inline-block; background: var(--accent-light); color: var(--accent-color);
            padding: 0 5px; border-radius: 2px; font-family: Consolas, monospace; font-size: 12px;
            cursor: pointer; border: 1px solid rgba(25,118,210,0.3); transition: background 0.15s;
        }
        .ref-tag:hover { background: #bbdefb; }

        .message-images { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .message-image {
            max-width: 180px; max-height: 180px;
            border-radius: var(--radius-sm); cursor: pointer;
            border: 1px solid var(--border-color);
        }

        /* --- Thinking Block 样式 --- */
        .thinking-container {
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.02);
            overflow: hidden;
        }
        .thinking-header {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .thinking-header:hover { background: rgba(0, 0, 0, 0.04); }
        .thinking-toggle-icon {
            margin-right: 6px;
            font-size: 10px;
            transition: transform 0.2s ease;
            display: inline-block;
        }
        .thinking-container.expanded .thinking-toggle-icon { transform: rotate(90deg); }
        .thinking-status-text { flex: 1; }
        .thinking-content {
            display: none;
            padding: 8px 12px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }
        .thinking-container.expanded .thinking-content { display: block; }

        /* 流式光标动画 */
        .block-streaming::after {
            content: '';
            display: inline-block;
            width: 6px;
            height: 14px;
            background: var(--accent-color);
            margin-left: 2px;
            vertical-align: middle;
            animation: cursor-blink 1s infinite;
        }
        @keyframes cursor-blink { 0%,100%{opacity:1} 50%{opacity:0} }

        /* 思考中脉冲动画 */
        @keyframes thinking-pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
        .thinking-container.streaming .thinking-status-text { animation: thinking-pulse 1.5s infinite; }

        /* --- Tool Block 样式（紫色主题） --- */
        .tool-container {
            margin-bottom: 8px;
            border: 1px solid rgba(156, 39, 176, 0.3);
            border-radius: 6px;
            background: rgba(156, 39, 176, 0.05);
            overflow: hidden;
        }
        .tool-container.streaming {
            border-color: rgba(156, 39, 176, 0.5);
            background: rgba(156, 39, 176, 0.08);
        }
        .tool-container.error {
            border-color: var(--error-color);
            background: rgba(245, 108, 108, 0.08);
        }
        .tool-header {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            font-size: 12px;
            color: #9c27b0;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            background: rgba(156, 39, 176, 0.1);
            border-bottom: 1px solid rgba(156, 39, 176, 0.2);
            transition: background 0.15s;
        }
        .tool-header:hover { background: rgba(156, 39, 176, 0.15); }
        .tool-toggle-icon {
            margin-right: 6px;
            font-size: 10px;
            transition: transform 0.2s ease;
            display: inline-block;
        }
        .tool-container.expanded .tool-toggle-icon { transform: rotate(90deg); }
        .tool-title { flex: 1; }
        .tool-status {
            font-size: 11px;
            margin-left: 8px;
            opacity: 0.8;
        }
        .tool-content {
            display: none;
            padding: 8px 10px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .tool-container.expanded .tool-content { display: block; }
        .tool-entry {
            padding: 6px 8px;
            margin-bottom: 6px;
            border-radius: var(--radius-sm);
            background: rgba(0, 0, 0, 0.02);
            border-left: 3px solid #9c27b0;
        }
        .tool-entry:last-child { margin-bottom: 0; }
        .tool-entry.error { border-left-color: var(--error-color); background: rgba(245, 108, 108, 0.05); }
        .tool-entry-name {
            font-family: Consolas, Monaco, monospace;
            color: #9c27b0;
            font-weight: 600;
            margin-bottom: 3px;
        }
        .tool-entry-detail {
            color: var(--text-secondary);
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .tool-entry-result {
            margin-top: 4px;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-primary);
            font-family: Consolas, Monaco, monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 200px;
            overflow-y: auto;
        }
        .tool-entry.error .tool-entry-result {
            color: var(--error-color);
        }

        .typing-indicator { display: flex; gap: 4px; padding: 8px 12px; }
        .typing-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--text-secondary);
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }

        #input-area {
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            padding: 8px 12px;
        }
        .file-previews { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
        .file-preview {
            position: relative; width: 48px; height: 48px;
            border-radius: var(--radius-sm); overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .file-preview img { width: 100%; height: 100%; object-fit: cover; }
        .file-preview-remove {
            position: absolute; top: 1px; right: 1px;
            width: 14px; height: 14px; border-radius: 50%;
            background: rgba(0,0,0,0.5); color: #fff; border: none;
            cursor: pointer; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
        }

        .input-wrapper { display: flex; gap: 6px; align-items: flex-end; }
        #message-input {
            flex: 1; background: var(--bg-input);
            border: 1px solid var(--border-color); color: var(--text-primary);
            border-radius: var(--radius-sm); padding: 7px 10px;
            font-family: var(--font-family); font-size: 13px;
            resize: none; min-height: 34px; max-height: 100px;
            outline: none; line-height: 1.5;
        }
        #message-input:focus { border-color: var(--accent-color); }
        #message-input::placeholder { color: var(--text-placeholder); }

        .input-btn {
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); color: var(--text-secondary);
            cursor: pointer; font-size: 15px; transition: all 0.15s;
        }
        .input-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        #send-btn { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
        #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #config-modal, #ui-settings-modal {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3); z-index: 1000;
            align-items: center; justify-content: center;
        }
        #config-modal.active, #ui-settings-modal.active { display: flex; }
        .modal-content {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            width: 400px; max-width: 90%; border-radius: var(--radius-md);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); padding: 16px;
        }
        .modal-header { font-size: 15px; font-weight: 600; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .form-group { margin-bottom: 12px; }
        .form-label { display: block; margin-bottom: 4px; color: var(--text-secondary); font-size: 12px; }
        .form-control {
            width: 100%; padding: 6px 8px; background: var(--bg-input);
            border: 1px solid var(--border-color); color: var(--text-primary);
            border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; outline: none;
        }
        .form-control:focus { border-color: var(--accent-color); }
        .form-hint { font-size: 11px; color: var(--text-placeholder); margin-top: 3px; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border-color); }
        .modal-actions .btn { width: auto; padding: 6px 20px; }

        .empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--text-secondary); gap: 8px;
        }
        .empty-state-icon { font-size: 40px; opacity: 0.3; }
        .empty-state-text { font-size: 15px; color: var(--text-primary); }
        .empty-state-hint { font-size: 12px; }

        /* --- 停止生成按钮 --- */
        #send-btn.generating {
            background: var(--error-color);
            border-color: var(--error-color);
        }
        #send-btn.generating:hover:not(:disabled) {
            opacity: 0.85;
        }

        /* --- 错误消息卡片 --- */
        .error-message-card {
            background: rgba(245, 108, 108, 0.08);
            border: 1px solid var(--error-color);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .error-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            color: var(--error-color);
            margin-bottom: 6px;
        }
        .error-code {
            opacity: 0.7;
            font-size: 11px;
            font-family: Consolas, monospace;
        }
        .error-details-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 3px 8px;
            cursor: pointer;
            font-size: 11px;
            color: var(--text-secondary);
            transition: all 0.15s;
        }
        .error-details-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* --- 消息操作栏 --- */
        .message-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .message.ai:hover .message-actions {
            opacity: 1;
        }
        .action-btn {
            background: none;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            padding: 2px 6px;
            cursor: pointer;
            font-size: 11px;
            color: var(--text-secondary);
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .action-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        /* --- ThinkingBlock 优化 --- */
        .thinking-copy-btn {
            background: none;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            padding: 2px 6px;
            cursor: pointer;
            font-size: 10px;
            color: var(--text-secondary);
            transition: all 0.15s;
            margin-left: auto;
        }
        .thinking-copy-btn:hover {
            background: rgba(0,0,0,0.05);
            border-color: var(--border-color);
        }
        .thinking-loading {
            display: inline-block;
            animation: thinking-dots 1.5s infinite;
        }
        @keyframes thinking-dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        .status-paused {
            color: var(--warning-color);
            font-style: italic;
        }

        /* --- 错误详情模态框 --- */
        #error-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        #error-modal.active {
            display: flex;
        }
        .error-modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            width: 500px;
            max-width: 90%;
            max-height: 80vh;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .error-modal-header {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .error-modal-body {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .error-modal-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        /* --- 调试日志模态框 --- */
        #debug-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        #debug-modal.active {
            display: flex;
        }
        .debug-modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            width: 700px;
            max-width: 90%;
            max-height: 80vh;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .debug-modal-header {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;

    <!-- Markdown 渲染库：动态加载（CDN 优先，失败时回退到本地） -->
    <script>
        (function() {
            // 动态加载脚本（CDN 优先，失败时回退到本地）
            function loadScript(cdnUrl, localUrl, name) {
                return new Promise((resolve, reject) => {
                    var script = document.createElement('script');
                    script.src = cdnUrl;
                    script.onload = function() {
                        console.log('[Vendor] ' + name + ' 从 CDN 加载成功');
                        resolve('cdn');
                    };
                    script.onerror = function() {
                        console.warn('[Vendor] ' + name + ' CDN 加载失败，尝试本地文件');
                        var localScript = document.createElement('script');
                        localScript.src = localUrl;
                        localScript.onload = function() {
                            console.log('[Vendor] ' + name + ' 从本地加载成功');
                            resolve('local');
                        };
                        localScript.onerror = function() {
                            console.error('[Vendor] ' + name + ' CDN 和本地都加载失败');
                            reject(new Error(name + ' 加载失败'));
                        };
                        document.head.appendChild(localScript);
                    };
                    document.head.appendChild(script);
                });
            }

            // 动态加载 CSS（CDN 优先，失败时回退到本地）
            function loadCSS(cdnUrl, localUrl, name) {
                return new Promise((resolve, reject) => {
                    var link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = cdnUrl;
                    link.onload = function() {
                        console.log('[Vendor] ' + name + ' CSS 从 CDN 加载成功');
                        resolve('cdn');
                    };
                    link.onerror = function() {
                        console.warn('[Vendor] ' + name + ' CSS CDN 加载失败，尝试本地文件');
                        var localLink = document.createElement('link');
                        localLink.rel = 'stylesheet';
                        localLink.href = localUrl;
                        localLink.onload = function() {
                            console.log('[Vendor] ' + name + ' CSS 从本地加载成功');
                            resolve('local');
                        };
                        localLink.onerror = function() {
                            console.error('[Vendor] ' + name + ' CSS CDN 和本地都加载失败');
                            reject(new Error(name + ' CSS 加载失败'));
                        };
                        document.head.appendChild(localLink);
                    };
                    document.head.appendChild(link);
                });
            }

            // 按顺序加载所有库
            Promise.resolve()
                // 1. marked.js
                .then(function() {
                    return loadScript(
                        'https://cdn.jsdelivr.net/npm/marked@17.0.1/lib/marked.umd.js',
                        'vendor/marked.umd.js',
                        'marked'
                    );
                })
                // 2. marked-footnote
                .then(function() {
                    return loadScript(
                        'https://cdn.jsdelivr.net/npm/marked-footnote@1.4.0/dist/index.umd.min.js',
                        'vendor/marked-footnote.umd.min.js',
                        'marked-footnote'
                    );
                })
                // 3. DOMPurify
                .then(function() {
                    return loadScript(
                        'https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js',
                        'vendor/purify.min.js',
                        'DOMPurify'
                    );
                })
                // 4. highlight.js CSS
                .then(function() {
                    return loadCSS(
                        'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css',
                        'vendor/github-dark.min.css',
                        'highlight.js'
                    );
                })
                // 5. highlight.js 核心
                .then(function() {
                    return loadScript(
                        'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js',
                        'vendor/highlight.min.js',
                        'highlight.js'
                    );
                })
                // 6. 语言包（并行加载）
                .then(function() {
                    return Promise.all([
                        loadScript(
                            'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/javascript.min.js',
                            'vendor/hljs-javascript.min.js',
                            'hljs-javascript'
                        ),
                        loadScript(
                            'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/python.min.js',
                            'vendor/hljs-python.min.js',
                            'hljs-python'
                        ),
                        loadScript(
                            'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/typescript.min.js',
                            'vendor/hljs-typescript.min.js',
                            'hljs-typescript'
                        ),
                        loadScript(
                            'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/json.min.js',
                            'vendor/hljs-json.min.js',
                            'hljs-json'
                        ),
                        loadScript(
                            'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/bash.min.js',
                            'vendor/hljs-bash.min.js',
                            'hljs-bash'
                        ),
                        loadScript(
                            'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/cpp.min.js',
                            'vendor/hljs-cpp.min.js',
                            'hljs-cpp'
                        ),
                        loadScript(
                            'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/languages/c.min.js',
                            'vendor/hljs-c.min.js',
                            'hljs-c'
                        )
                    ]);
                })
                .then(function() {
                    console.log('[Vendor] 所有库加载完成');
                    // 触发自定义事件，通知页面库已加载完成
                    window.dispatchEvent(new Event('vendorLibsLoaded'));
                })
                .catch(function(error) {
                    console.error('[Vendor] 库加载失败:', error);
                });
        })();
    </script>

    <script>
        // ============ 状态管理 ============

        var messages = [];           // 当前会话的消息列表
        var attachedFiles = [];      // 待发送的附件
        var schematicData = null;    // 原理图数据
        var isThinking = false;      // AI 是否正在处理
        var currentConfig = {};      // 当前 AI 配置
        var historySessions = [];    // 历史会话列表
        var currentSessionId = null; // 当前会话 ID
        var pendingRequests = {};    // 待处理的请求 {requestId: {sessionId, timestamp}}
        var saveHistoryTimer = null; // 历史保存节流定时器
        var activeRequestId = null;  // 当前正在进行的请求ID（用于 abort）
        var availableTools = [];     // MCP 工具清单

        // 不触发历史保存的系统错误（避免错误循环）
        var NON_PERSIST_SYSTEM_ERROR = {
            HISTORY_SAVE_FAILED: true,
            CONFIG_SAVE_FAILED: true
        };

        // ============ 调试日志 ============

        var debugLogs = [];
        var MAX_DEBUG_LOGS = 500;

        function addDebugLog(level, message, data) {
            var timestamp = new Date().toISOString().substring(11, 23); // HH:mm:ss.SSS
            debugLogs.push({
                timestamp: timestamp,
                level: level,
                message: message,
                data: data
            });
            if (debugLogs.length > MAX_DEBUG_LOGS) {
                debugLogs.shift();
            }
        }

        function renderDebugLogs() {
            var body = document.getElementById('debug-modal-body');
            var stats = document.getElementById('debug-stats');

            if (debugLogs.length === 0) {
                body.innerHTML = '<div style="color: #888; text-align: center; padding: 20px;">暂无日志</div>';
                stats.textContent = '0 条日志';
                return;
            }

            stats.textContent = debugLogs.length + ' 条日志';

            var html = '';
            for (var i = debugLogs.length - 1; i >= 0; i--) {
                var log = debugLogs[i];
                html += '<div class="debug-log-entry ' + log.level + '">';
                html += '<span class="debug-log-time">' + log.timestamp + '</span>';
                html += '<span class="debug-log-level ' + log.level + '">' + log.level.toUpperCase() + '</span>';
                html += '<span class="debug-log-message">' + escapeHtml(log.message) + '</span>';
                if (log.data) {
                    html += '<pre style="margin-top: 4px; color: #888; font-size: 11px;">' + escapeHtml(JSON.stringify(log.data, null, 2)) + '</pre>';
                }
                html += '</div>';
            }
            body.innerHTML = html;
        }

        function copyDebugLogs() {
            var text = '=== AI 原理图助手 - 调试日志 ===\n';
            text += '生成时间: ' + new Date().toISOString() + '\n';
            text += '日志数量: ' + debugLogs.length + '\n\n';

            for (var i = 0; i < debugLogs.length; i++) {
                var log = debugLogs[i];
                text += '[' + log.timestamp + '] [' + log.level.toUpperCase() + '] ' + log.message;
                if (log.data) {
                    text += '\n' + JSON.stringify(log.data, null, 2);
                }
                text += '\n\n';
            }

            copyToClipboard(text);
        }

        function clearDebugLogs() {
            debugLogs = [];
            renderDebugLogs();
        }

        function openDebugModal() {
            renderDebugLogs();
            document.getElementById('debug-modal').classList.add('active');
        }

        function closeDebugModal() {
            document.getElementById('debug-modal').classList.remove('active');
        }

        // ============ DOM 引用 ============

        var sidebar = document.getElementById('sidebar');
        var messagesContainer = document.getElementById('messages');
        var messageInput = document.getElementById('message-input');
        var sendBtn = document.getElementById('send-btn');
        var attachBtn = document.getElementById('attach-btn');
        var fileInput = document.getElementById('file-input');
        var filePreviews = document.getElementById('file-previews');
        var statusDot = document.getElementById('status-dot');
        var statusText = document.getElementById('status-text');
        var configModal = document.getElementById('config-modal');
        var historyList = document.getElementById('history-list');

        // ============ 初始化 ============

        init();

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0;
                var v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function init() {
            setupEventListeners();
            setStatus('ready', '就绪');
            publishMessage('ai-chat/request-data', {});
            publishMessage('ai-chat/request-config', {});
            publishMessage('ai-chat/request-history', {});
            publishMessage('ai-chat/request-tools', {
                requestId: 'bootstrap-tools',
                sessionId: 'bootstrap'
            });
        }

        // ============ 流式更新管理器（参考 Cherry Studio StreamManager） ============

        var StreamManager = (function() {
            var pendingUpdates = {};
            var rafId = null;

            function applyUpdates() {
                for (var id in pendingUpdates) {
                    if (!pendingUpdates.hasOwnProperty(id)) continue;
                    var update = pendingUpdates[id];
                    var el = document.getElementById(id);
                    if (!el) continue;

                    if (update.blockType === 'thinking') {
                        var contentEl = el.querySelector('.thinking-content');
                        if (contentEl) {
                            // 流式阶段使用 textContent（性能优化）
                            if (update.status === 'streaming') {
                                contentEl.textContent = update.content;
                            } else {
                                // 完成后使用 Markdown 渲染
                                addDebugLog('info', '[Thinking Block] 调用 parseMarkdown', {
                                    blockId: update.blockId,
                                    status: update.status,
                                    contentLength: update.content ? update.content.length : 0
                                });
                                var html = parseMarkdown(update.content);
                                contentEl.innerHTML = html;
                            }
                        }
                        var statusEl = el.querySelector('.thinking-status-text');
                        if (statusEl) {
                            if (update.status === 'streaming') {
                                var elapsed = ((Date.now() - update.startTime) / 1000).toFixed(1);
                                statusEl.textContent = '思考中... ' + elapsed + 's';
                            } else if (update.status === 'paused') {
                                statusEl.innerHTML = '<span class="status-paused">已停止思考</span>';
                            } else {
                                // 由于后端一次性发送所有事件，时间计算不准确，改为固定文案
                                statusEl.textContent = 'AI已深度思考';
                            }
                        }
                        // 流式状态下自动展开，完成/暂停后自动折叠（参考 Cherry Studio）
                        if (update.status === 'streaming') {
                            if (el.className.indexOf('streaming') === -1) {
                                el.className += ' streaming';
                            }
                            if (el.className.indexOf('expanded') === -1) {
                                el.className += ' expanded';
                            }
                        } else {
                            el.className = el.className.replace(' streaming', '');
                            // 完成或暂停后自动折叠（Cherry Studio 的行为）
                            if (update.status === 'success' || update.status === 'paused') {
                                el.className = el.className.replace(' expanded', '');
                            }
                        }
                    } else {
                        // text block 更新（参考 Cherry Studio 的平滑流式渲染）
                        if (update.status === 'streaming') {
                            // 流式阶段：轻渲染（仅 textContent，避免 O(n²) 解析）
                            el.textContent = update.content;
                            if (el.className.indexOf('block-streaming') === -1) {
                                el.className += ' block-streaming';
                            }
                        } else {
                            // 完成阶段：全量渲染（Markdown + 高亮）
                            addDebugLog('info', '[Text Block] 调用 parseMarkdown', {
                                blockId: update.blockId,
                                status: update.status,
                                contentLength: update.content ? update.content.length : 0,
                                contentPreview: update.content ? update.content.substring(0, 100) : ''
                            });
                            var html = parseMarkdown(update.content);
                            el.innerHTML = html;
                            highlightReferencesDOM(el);
                            el.className = el.className.replace(' block-streaming', '');

                            // paused 状态添加标记
                            if (update.status === 'paused' && !el.querySelector('.status-paused')) {
                                var pausedMark = document.createElement('div');
                                pausedMark.className = 'status-paused';
                                pausedMark.style.fontSize = '11px';
                                pausedMark.style.marginTop = '6px';
                                pausedMark.textContent = '[已停止生成]';
                                el.appendChild(pausedMark);
                            }
                        }
                    }
                }
                pendingUpdates = {};
                rafId = null;

                // 自动滚动到底部
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            return {
                updateBlock: function(blockId, content, blockType, status, startTime, thinkingMs) {
                    pendingUpdates[blockId] = {
                        content: content,
                        blockType: blockType,
                        status: status,
                        startTime: startTime || Date.now(),
                        thinkingMs: thinkingMs || 0
                    };
                    if (!rafId) {
                        rafId = requestAnimationFrame(applyUpdates);
                    }
                }
            };
        })();

        // ============ 历史记录管理 ============

        function saveHistory() {
            if (saveHistoryTimer) clearTimeout(saveHistoryTimer);
            saveHistoryTimer = setTimeout(function() {
                saveHistoryTimer = null;
                doSaveHistory();
            }, 500);
        }

        function flushHistory() {
            if (saveHistoryTimer) {
                clearTimeout(saveHistoryTimer);
                saveHistoryTimer = null;
            }
            doSaveHistory();
        }

        function doSaveHistory() {
            if (messages.length === 0) return;

            // 序列化消息：将 blocks 转为纯文本（thinking + text 合并）
            var lightweight = messages
                .filter(function(msg) { return !msg.transient; })
                .map(function(msg) {
                    var content = '';
                    if (msg.blocks && msg.blocks.length > 0) {
                        // 从 blocks 中提取 text 和 error 内容
                        for (var i = 0; i < msg.blocks.length; i++) {
                            var block = msg.blocks[i];
                            if (block.type === 'text' && block.content) {
                                content += block.content;
                            } else if (block.type === 'error' && block.content) {
                                content += '错误: ' + block.content;
                            }
                        }
                    }
                    if (!content) content = msg.content || '';

                    var copy = { role: msg.role, content: content, timestamp: msg.timestamp };
                    if (msg.images && msg.images.length > 0) {
                        copy.imageCount = msg.images.length;
                    }
                    // 保存 thinking 摘要
                    if (msg.blocks) {
                        for (var j = 0; j < msg.blocks.length; j++) {
                            if (msg.blocks[j].type === 'thinking' && msg.blocks[j].content) {
                                copy.thinkingSummary = msg.blocks[j].content.substring(0, 200);
                                copy.thinkingMs = msg.blocks[j].thinkingMs || 0;
                                break;
                            }
                        }
                    }
                    return copy;
                });

            if (!currentSessionId) {
                currentSessionId = 'session_' + Date.now();
            }

            var found = false;
            for (var i = 0; i < historySessions.length; i++) {
                if (historySessions[i].id === currentSessionId) {
                    historySessions[i].messages = lightweight;
                    historySessions[i].title = getSessionTitle(lightweight);
                    historySessions[i].updatedAt = Date.now();
                    found = true;
                    break;
                }
            }
            if (!found) {
                historySessions.unshift({
                    id: currentSessionId,
                    title: getSessionTitle(lightweight),
                    messages: lightweight,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                });
            }

            if (historySessions.length > 20) {
                historySessions = historySessions.slice(0, 20);
            }

            publishMessage('ai-chat/history-update', { messages: historySessions });
            renderHistoryList();
        }

        function getSessionTitle(msgs) {
            for (var i = 0; i < msgs.length; i++) {
                if (msgs[i].role === 'user' && msgs[i].content) {
                    var title = msgs[i].content.substring(0, 30);
                    if (msgs[i].content.length > 30) title += '...';
                    return title;
                }
            }
            return '新对话';
        }

        function renderHistoryList() {
            historyList.innerHTML = '';
            if (historySessions.length === 0) {
                historyList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
                return;
            }
            historySessions.forEach(function(session) {
                var item = document.createElement('div');
                item.className = 'history-item' + (session.id === currentSessionId ? ' active' : '');
                item.textContent = session.title || '新对话';
                item.title = session.title || '新对话';
                item.addEventListener('click', function() { loadSession(session.id); });
                historyList.appendChild(item);
            });
        }

        function loadSession(sessionId) {
            if (messages.length > 0) flushHistory();

            for (var i = 0; i < historySessions.length; i++) {
                if (historySessions[i].id === sessionId) {
                    currentSessionId = sessionId;
                    // 从历史记录恢复消息（转为 block 架构）
                    messages = historySessions[i].messages.slice().map(function(msg) {
                        var blocks = [];
                        // 恢复 thinking block（如果有摘要）
                        if (msg.thinkingSummary) {
                            blocks.push({
                                id: generateUUID(),
                                type: 'thinking',
                                content: msg.thinkingSummary,
                                thinkingMs: msg.thinkingMs || 0,
                                status: 'success'
                            });
                        }
                        // text block
                        if (msg.content) {
                            blocks.push({
                                id: generateUUID(),
                                type: 'text',
                                content: msg.content,
                                status: 'success'
                            });
                        }
                        return {
                            id: generateUUID(),
                            role: msg.role,
                            blocks: blocks,
                            content: msg.content,
                            images: null,
                            imageCount: msg.imageCount || 0,
                            timestamp: msg.timestamp
                        };
                    });

                    isThinking = false;
                    setStatus('ready', '就绪');
                    activeRequestId = null;
                    updateSendButton();
                    pendingRequests = {};
                    renderMessages();
                    renderHistoryList();
                    // 不清空会话，而是重建历史上下文
                    // 将历史消息发送给后端，让 ChatSession 重建 history
                    var historyMessages = messages.map(function(msg) {
                        return {
                            role: msg.role === 'user' ? 'user' : 'assistant',
                            content: msg.content || '',
                            thinkingSummary: msg.blocks ? msg.blocks.find(function(b) { return b.type === 'thinking'; })?.content : null
                        };
                    });

                    publishMessage('ai-chat/restore-session', {
                        sessionId: sessionId,
                        messages: historyMessages
                    });

                    return;
                }
            }
        }

        // ============ 事件监听 ============

        function setupEventListeners() {
            document.getElementById('toggle-sidebar').addEventListener('click', function() {
                sidebar.classList.toggle('collapsed');
            });
            document.getElementById('btn-config').addEventListener('click', openConfigModal);
            document.getElementById('btn-cancel-config').addEventListener('click', closeConfigModal);
            document.getElementById('btn-save-config').addEventListener('click', saveConfig);
            document.getElementById('header-ui-settings-btn').addEventListener('click', openUISettingsModal);
            document.getElementById('btn-cancel-ui-settings').addEventListener('click', closeUISettingsModal);
            document.getElementById('btn-save-ui-settings').addEventListener('click', saveUISettings);
            document.getElementById('btn-new-chat').addEventListener('click', newChat);
            document.getElementById('btn-close-error-modal').addEventListener('click', closeErrorModal);
            document.getElementById('btn-debug-log').addEventListener('click', openDebugModal);
            document.getElementById('header-debug-btn').addEventListener('click', openDebugModal);
            document.getElementById('btn-close-debug-modal').addEventListener('click', closeDebugModal);
            document.getElementById('btn-copy-debug-log').addEventListener('click', copyDebugLogs);
            document.getElementById('btn-clear-debug-log').addEventListener('click', clearDebugLogs);
            attachBtn.addEventListener('click', function() { fileInput.click(); });
            fileInput.addEventListener('change', handleFileSelect);
            sendBtn.addEventListener('click', handleSendOrAbort);
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!isThinking) sendMessage();
                }
            });
            messageInput.addEventListener('input', function() {
                messageInput.style.height = 'auto';
                messageInput.style.height = messageInput.scrollHeight + 'px';
            });

            // 键盘快捷键：Ctrl+D 打开调试日志
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'd') {
                    e.preventDefault();
                    openDebugModal();
                }
            });

            // 拦截所有链接点击，在默认浏览器中打开
            document.addEventListener('click', function(e) {
                var target = e.target;
                // 向上查找，找到 <a> 标签
                while (target && target.tagName !== 'A') {
                    target = target.parentElement;
                }
                if (target && target.tagName === 'A' && target.href) {
                    e.preventDefault();
                    e.stopPropagation();
                    // 在新窗口打开链接（会使用默认浏览器）
                    window.open(target.href, '_blank', 'noopener,noreferrer');
                }
            }, true); // 使用捕获阶段，确保优先处理

            if (typeof eda !== 'undefined' && eda.sys_MessageBus) {
                eda.sys_MessageBus.subscribePublic('ai-chat/schematic-data', handleSchematicData);
                eda.sys_MessageBus.subscribePublic('ai-chat/config-data', handleConfigData);
                eda.sys_MessageBus.subscribePublic('ai-chat/history-data', handleHistoryData);
                eda.sys_MessageBus.subscribePublic('ai-chat/tools-data', handleToolsData);
                eda.sys_MessageBus.subscribePublic('ai-chat/ai-response', handleAIResponse);
                eda.sys_MessageBus.subscribePublic('ai-chat/ai-thinking', handleAIThinking);
                eda.sys_MessageBus.subscribePublic('ai-chat/ai-text', handleAIText);
                eda.sys_MessageBus.subscribePublic('ai-chat/tool-event', handleToolEvent);
                eda.sys_MessageBus.subscribePublic('ai-chat/error', handleError);
                eda.sys_MessageBus.subscribePublic('ai-chat/debug-log', handleDebugLog);
            }
        }

        // ============ MessageBus 处理器 ============

        function handleDebugLog(data) {
            if (!data) return;
            addDebugLog(data.level || 'info', data.message || '', data.data);
        }

        function handleSchematicData(data) {
            if (!data || !data.summary) return;
            schematicData = data;
            var c = data.summary.components;
            var p = data.summary.pins;
            var n = data.summary.nets;

            if (c < 0) {
                addDebugLog('info', '原理图数据采集中...');
            } else {
                addDebugLog('success', '原理图数据就绪', {
                    components: c,
                    pins: p,
                    nets: n,
                    timestamp: data.timestamp
                });
            }

            document.getElementById('info-components').textContent = '器件: ' + (c < 0 ? '采集中...' : c);
            document.getElementById('info-pins').textContent = '引脚: ' + (p < 0 ? '采集中...' : p);
            document.getElementById('info-nets').textContent = '网络: ' + (n < 0 ? '采集中...' : n);
        }

        function handleConfigData(data) {
            if (!data) return;
            currentConfig = data;
            updateToolInfoText();
            updateToolsPreviewText();
            if (configModal.classList.contains('active')) {
                document.getElementById('cfg-apiurl').value = data.apiUrl || 'https://api.openai.com/v1/chat/completions';
                document.getElementById('cfg-apikey').value = data.apiKey || '';
                document.getElementById('cfg-model').value = data.model || 'gpt-4o';
                document.getElementById('cfg-mcp-enabled').checked = !!data.mcpEnabled;
                document.getElementById('cfg-mcp-gateway-url').value = data.mcpGatewayUrl || '';
                document.getElementById('cfg-mcp-gateway-apikey').value = data.mcpGatewayApiKey || '';
                document.getElementById('cfg-mcp-auto-approve').checked = data.mcpAutoApprove !== false;
            }
            if (data.mcpEnabled) {
                publishMessage('ai-chat/request-tools', {
                    requestId: 'refresh-tools-' + Date.now(),
                    sessionId: currentSessionId || 'config-refresh'
                });
            }
        }

        function updateToolInfoText() {
            var toolsInfoEl = document.getElementById('info-tools');
            if (!toolsInfoEl) return;
            if (!currentConfig.mcpEnabled) {
                toolsInfoEl.textContent = 'MCP: 未启用';
                return;
            }
            if (!currentConfig.mcpGatewayUrl) {
                toolsInfoEl.textContent = 'MCP: 未配置网关';
                return;
            }
            if (availableTools.length > 0) {
                toolsInfoEl.textContent = 'MCP: 已启用 (' + availableTools.length + ' 个工具)';
            } else {
                toolsInfoEl.textContent = 'MCP: 已启用 (工具加载中)';
            }
        }

        function updateToolsPreviewText() {
            var previewEl = document.getElementById('cfg-tools-preview');
            if (!previewEl) return;
            if (!currentConfig.mcpEnabled) {
                previewEl.textContent = '未启用 MCP 工具';
                return;
            }
            if (availableTools.length === 0) {
                previewEl.textContent = '工具列表为空或尚未加载';
                return;
            }
            var names = availableTools.map(function(tool) { return tool.name; }).join(', ');
            previewEl.textContent = '已加载: ' + names.substring(0, 180);
        }

        function handleToolsData(data) {
            if (!data) return;
            availableTools = Array.isArray(data.tools) ? data.tools : [];

            if (data.error) {
                addDebugLog('warn', '工具列表加载失败', {
                    error: data.error
                });
            } else {
                addDebugLog('info', '工具列表更新', {
                    enabled: !!data.enabled,
                    count: availableTools.length
                });
            }

            if (currentConfig && typeof currentConfig === 'object') {
                currentConfig.mcpEnabled = !!data.enabled;
            }
            updateToolInfoText();
            updateToolsPreviewText();
        }

        function handleHistoryData(data) {
            if (!data || !Array.isArray(data.messages)) return;
            historySessions = data.messages;
            renderHistoryList();
            if (messages.length === 0 && historySessions.length > 0) {
                loadSession(historySessions[0].id);
            }
        }

        function handleToolEvent(data) {
            if (!data || !data.requestId || !data.sessionId) return;
            if (data.sessionId !== currentSessionId) return;

            addDebugLog(data.status === 'error' ? 'error' : 'info', '工具事件: ' + (data.title || ''), {
                requestId: data.requestId,
                toolName: data.toolName,
                status: data.status,
                detail: data.detail
            });

            var msg = getOrCreateStreamingMessage(data.requestId);
            var toolBlock = findBlockByType(msg, 'tool');
            if (!toolBlock) {
                toolBlock = {
                    id: 'tool-' + data.requestId,
                    type: 'tool',
                    status: 'streaming',
                    entries: []
                };

                // 插在 thinking 之后
                var insertIndex = msg.blocks.length;
                for (var i = 0; i < msg.blocks.length; i++) {
                    if (msg.blocks[i].type === 'thinking') {
                        insertIndex = i + 1;
                    }
                }
                msg.blocks.splice(insertIndex, 0, toolBlock);
            }

            if (!Array.isArray(toolBlock.entries)) {
                toolBlock.entries = [];
            }

            var entryId = data.toolCallId || data.eventId || ('tool-event-' + Date.now());
            var entry = null;
            for (var j = 0; j < toolBlock.entries.length; j++) {
                if (toolBlock.entries[j].id === entryId) {
                    entry = toolBlock.entries[j];
                    break;
                }
            }

            if (!entry) {
                entry = {
                    id: entryId,
                    toolName: data.toolName || (data.stage === 'tools-list' ? '工具清单' : '工具调用'),
                    status: data.status || 'pending',
                    detail: '',
                    resultPreview: '',
                    error: ''
                };
                toolBlock.entries.push(entry);
            }

            entry.status = data.status || entry.status;
            entry.detail = data.detail || data.title || entry.detail;
            entry.resultPreview = data.resultPreview || entry.resultPreview;
            entry.error = data.error || entry.error;

            toolBlock.status = computeToolBlockStatus(toolBlock.entries);
            renderMessages();
        }

        function computeToolBlockStatus(entries) {
            var hasError = false;
            var hasRunning = false;
            for (var i = 0; i < entries.length; i++) {
                var st = entries[i].status;
                if (st === 'error') hasError = true;
                if (st === 'running' || st === 'pending') hasRunning = true;
            }
            if (hasError) return 'error';
            if (hasRunning) return 'streaming';
            return 'success';
        }

        /**
         * 处理 AI 完整响应（请求结束后的最终文本）
         */
        function handleAIResponse(data) {
            if (!data || !data.content) {
                return;
            }
            if (!data.requestId || !data.sessionId) {
                return;
            }

            addDebugLog('info', 'AI 响应完成', {
                requestId: data.requestId,
                contentLength: data.content.length
            });

            var pending = pendingRequests[data.requestId];
            if (!pending) {
                return;
            }
            if (pending.sessionId !== currentSessionId) {
                delete pendingRequests[data.requestId];
                return;
            }
            if (data.sessionId !== pending.sessionId) {
                delete pendingRequests[data.requestId];
                return;
            }

            delete pendingRequests[data.requestId];
            finishPendingRequest(data.requestId);

            // 查找流式创建的 AI 消息，更新其状态为 success
            var streamMsg = findStreamingMessage(data.requestId);
            if (streamMsg) {
                // 确保 text block 有最终内容
                var hasTextBlock = false;
                for (var i = 0; i < streamMsg.blocks.length; i++) {
                    if (streamMsg.blocks[i].type === 'text') {
                        streamMsg.blocks[i].status = 'success';
                        if (!streamMsg.blocks[i].content) {
                            streamMsg.blocks[i].content = data.content;
                        }
                        hasTextBlock = true;
                    }
                    if (streamMsg.blocks[i].type === 'thinking') {
                        streamMsg.blocks[i].status = 'success';
                    }
                    if (streamMsg.blocks[i].type === 'tool') {
                        streamMsg.blocks[i].status = streamMsg.blocks[i].status === 'error' ? 'error' : 'success';
                        if (Array.isArray(streamMsg.blocks[i].entries)) {
                            streamMsg.blocks[i].entries.forEach(function(entry) {
                                if (entry.status === 'running' || entry.status === 'pending') {
                                    entry.status = 'success';
                                }
                            });
                        }
                    }
                }
                if (!hasTextBlock) {
                    streamMsg.blocks.push({
                        id: generateUUID(),
                        type: 'text',
                        content: data.content,
                        status: 'success'
                    });
                }
                streamMsg.status = 'success';
            } else {
                // 没有流式消息（可能是非流式响应），创建新消息
                messages.push({
                    id: generateUUID(),
                    role: 'ai',
                    blocks: [{
                        id: generateUUID(),
                        type: 'text',
                        content: data.content,
                        status: 'success'
                    }],
                    timestamp: Date.now(),
                    requestId: data.requestId
                });
            }

            saveHistory();
            renderMessages();
        }

        /**
         * 处理 AI Thinking 流式块
         */
        function handleAIThinking(data) {
            // 只记录 START 和 COMPLETE 事件，不记录每个 DELTA
            if (data.type === 'THINKING_START' || data.type === 'THINKING_COMPLETE') {
                addDebugLog('info', 'Thinking 事件: ' + (data.type || 'unknown'), {
                    type: data.type,
                    requestId: data.requestId,
                    sessionId: data.sessionId,
                    currentSessionId: currentSessionId,
                    contentLength: data.accumulatedContent ? data.accumulatedContent.length : 0
                });
            }

            if (!data || !data.requestId || !data.sessionId) {
                addDebugLog('warn', 'Thinking 事件缺少必要字段', data);
                return;
            }

            // 修复：不再严格要求 pendingRequests 存在
            // 因为 AI_RESPONSE 可能先到，导致 pending 被清理
            // 只要 sessionId 匹配就处理事件
            if (data.sessionId !== currentSessionId) {
                addDebugLog('warn', 'Thinking sessionId 不匹配', {
                    currentSessionId: currentSessionId,
                    eventSessionId: data.sessionId
                });
                return;
            }

            var msg = getOrCreateStreamingMessage(data.requestId);
            var thinkingBlock = findBlockByType(msg, 'thinking');

            switch (data.type) {
                case 'THINKING_START':
                    if (!thinkingBlock) {
                        thinkingBlock = {
                            id: 'thinking-' + data.requestId,
                            type: 'thinking',
                            content: '',
                            thinkingMs: 0,
                            status: 'streaming',
                            startTime: Date.now()
                        };
                        msg.blocks.unshift(thinkingBlock); // 添加到开头，显示在正文上面
                        renderMessages(); // 首次需要完整渲染以插入 DOM
                    }
                    break;

                case 'THINKING_DELTA':
                    if (thinkingBlock) {
                        thinkingBlock.content = data.accumulatedContent || '';
                        thinkingBlock.thinkingMs = Date.now() - (thinkingBlock.startTime || Date.now());
                        StreamManager.updateBlock(
                            thinkingBlock.id,
                            thinkingBlock.content,
                            'thinking',
                            'streaming',
                            thinkingBlock.startTime,
                            thinkingBlock.thinkingMs
                        );
                    }
                    break;

                case 'THINKING_COMPLETE':
                    if (thinkingBlock) {
                        thinkingBlock.content = data.accumulatedContent || thinkingBlock.content;
                        thinkingBlock.thinkingMs = Date.now() - (thinkingBlock.startTime || Date.now());
                        thinkingBlock.status = data.status === 'paused' ? 'paused' : 'success';
                        StreamManager.updateBlock(
                            thinkingBlock.id,
                            thinkingBlock.content,
                            'thinking',
                            thinkingBlock.status,
                            thinkingBlock.startTime,
                            thinkingBlock.thinkingMs
                        );
                    }
                    // 注意：paused 状态不在此清理 pending，
                    // 后端会先发 THINKING_COMPLETE 再发 TEXT_COMPLETE，
                    // 清理推迟到 TEXT_COMPLETE(paused) 统一处理
                    break;
            }
        }

        /**
         * 处理 AI Text 流式块
         */
        function handleAIText(data) {
            // 只记录 START 和 COMPLETE 事件，不记录每个 DELTA
            if (data.type === 'TEXT_START' || data.type === 'TEXT_COMPLETE') {
                addDebugLog('info', 'Text 事件: ' + (data.type || 'unknown'), {
                    type: data.type,
                    requestId: data.requestId,
                    sessionId: data.sessionId,
                    currentSessionId: currentSessionId,
                    contentLength: data.accumulatedContent ? data.accumulatedContent.length : 0
                });
            }

            if (!data || !data.requestId || !data.sessionId) {
                addDebugLog('warn', 'Text 事件缺少必要字段', data);
                return;
            }

            // 修复：不再严格要求 pendingRequests 存在
            // 因为 AI_RESPONSE 可能先到，导致 pending 被清理
            // 只要 sessionId 匹配就处理事件
            if (data.sessionId !== currentSessionId) {
                console.warn('[前端] handleAIText sessionId 不匹配，跳过. 当前:', currentSessionId, '事件:', data.sessionId);
                addDebugLog('warn', 'Text sessionId 不匹配', {
                    currentSessionId: currentSessionId,
                    eventSessionId: data.sessionId
                });
                return;
            }

            var msg = getOrCreateStreamingMessage(data.requestId);
            var textBlock = findBlockByType(msg, 'text');

            switch (data.type) {
                case 'TEXT_START':
                    if (!textBlock) {
                        textBlock = {
                            id: 'text-' + data.requestId,
                            type: 'text',
                            content: '',
                            status: 'streaming'
                        };
                        msg.blocks.push(textBlock);
                        renderMessages(); // 首次需要完整渲染以插入 DOM
                    }
                    break;

                case 'TEXT_DELTA':
                    if (textBlock) {
                        textBlock.content = data.accumulatedContent || '';
                        StreamManager.updateBlock(
                            textBlock.id,
                            textBlock.content,
                            'text',
                            'streaming'
                        );
                    }
                    break;

                case 'TEXT_COMPLETE':
                    if (textBlock) {
                        textBlock.content = data.accumulatedContent || textBlock.content;
                        textBlock.status = data.status === 'paused' ? 'paused' : 'success';
                        StreamManager.updateBlock(
                            textBlock.id,
                            textBlock.content,
                            'text',
                            textBlock.status
                        );
                    }
                    // paused 状态需要清理 thinking 状态
                    if (data.status === 'paused') {
                        finishPendingRequest(data.requestId);
                        renderMessages(); // 确保 DOM 更新
                    }
                    break;
            }
        }

        /**
         * 获取或创建流式消息
         */
        function getOrCreateStreamingMessage(requestId) {
            for (var i = messages.length - 1; i >= 0; i--) {
                if (messages[i].requestId === requestId && messages[i].role === 'ai') {
                    return messages[i];
                }
            }
            // 创建新的流式 AI 消息
            var msg = {
                id: generateUUID(),
                role: 'ai',
                blocks: [],
                timestamp: Date.now(),
                requestId: requestId,
                status: 'streaming'
            };
            messages.push(msg);
            return msg;
        }

        function findStreamingMessage(requestId) {
            for (var i = messages.length - 1; i >= 0; i--) {
                if (messages[i].requestId === requestId && messages[i].role === 'ai') {
                    return messages[i];
                }
            }
            return null;
        }

        function findBlockByType(msg, type) {
            if (!msg || !Array.isArray(msg.blocks)) return null;
            for (var i = 0; i < msg.blocks.length; i++) {
                if (msg.blocks[i].type === type) {
                    return msg.blocks[i];
                }
            }
            return null;
        }

        function findBlockByType(msg, type) {
            if (!msg.blocks) return null;
            for (var i = 0; i < msg.blocks.length; i++) {
                if (msg.blocks[i].type === type) return msg.blocks[i];
            }
            return null;
        }

        function handleError(data) {
            addDebugLog('error', '收到错误: ' + (data.message || '未知错误'), {
                code: data.code,
                requestId: data.requestId,
                details: data.details
            });

            if (data.requestId) {
                var pending = pendingRequests[data.requestId];
                if (!pending) return;
                if (data.sessionId && data.sessionId !== pending.sessionId) {
                    delete pendingRequests[data.requestId];
                    return;
                }
                delete pendingRequests[data.requestId];
                finishPendingRequest(data.requestId);

                // 查找已有的流式消息，在其上追加错误 block
                var streamMsg = findStreamingMessage(data.requestId);
                if (streamMsg) {
                    streamMsg.blocks.push({
                        id: generateUUID(),
                        type: 'error',
                        content: data.message || '未知错误',
                        errorCode: data.code || '',
                        errorDetails: data.details || null,
                        status: 'error'
                    });
                    for (var k = 0; k < streamMsg.blocks.length; k++) {
                        if (streamMsg.blocks[k].type === 'tool') {
                            streamMsg.blocks[k].status = 'error';
                            if (Array.isArray(streamMsg.blocks[k].entries)) {
                                streamMsg.blocks[k].entries.forEach(function(entry) { entry.status = 'error'; });
                            }
                        }
                    }
                    streamMsg.status = 'error';
                } else {
                    messages.push({
                        id: generateUUID(),
                        role: 'ai',
                        blocks: [{
                            id: generateUUID(),
                            type: 'error',
                            content: data.message || '未知错误',
                            errorCode: data.code || '',
                            errorDetails: data.details || null,
                            status: 'error'
                        }],
                        timestamp: Date.now(),
                        requestId: data.requestId
                    });
                }
                saveHistory();
                renderMessages();
                return;
            }

            // 系统错误（无 requestId）
            messages.push({
                id: generateUUID(),
                role: 'ai',
                blocks: [{
                    id: generateUUID(),
                    type: 'error',
                    content: data.message || '未知错误',
                    errorCode: data.code || '',
                    errorDetails: data.details || null,
                    status: 'error'
                }],
                timestamp: Date.now()
            });
            if (!NON_PERSIST_SYSTEM_ERROR[data.code]) saveHistory();
            renderMessages();
        }

        // ============ 发送消息 ============

        function handleSendOrAbort() {
            if (isThinking && activeRequestId) {
                abortGeneration();
            } else {
                sendMessage();
            }
        }

        function sendMessage() {
            var text = messageInput.value.trim();
            if (!text && attachedFiles.length === 0) return;
            if (isThinking) return;

            if (!currentSessionId) {
                currentSessionId = 'session_' + Date.now();
            }

            var requestId = generateUUID();
            activeRequestId = requestId;

            // 创建用户消息（Block 架构）
            var userBlocks = [];
            if (text) {
                userBlocks.push({ id: generateUUID(), type: 'text', content: text, status: 'success' });
            }

            var userMsg = {
                id: generateUUID(),
                role: 'user',
                blocks: userBlocks,
                content: text,
                images: attachedFiles.slice(),
                timestamp: Date.now()
            };
            messages.push(userMsg);
            saveHistory();
            renderMessages();

            messageInput.value = '';
            messageInput.style.height = 'auto';
            attachedFiles = [];
            renderFilePreviews();

            setStatus('thinking', 'AI 正在思考...');
            isThinking = true;
            updateSendButton();

            pendingRequests[requestId] = {
                sessionId: currentSessionId,
                timestamp: Date.now()
            };

            publishMessage('ai-chat/user-message', {
                text: text,
                images: userMsg.images,
                schematicData: schematicData,
                requestId: requestId,
                sessionId: currentSessionId
            });
        }

        function abortGeneration() {
            if (!activeRequestId) return;

            publishMessage('ai-chat/abort-request', {
                requestId: activeRequestId,
                sessionId: currentSessionId
            });

            // 不立即清理状态，等后端返回 paused 状态后再清理
            // 但如果后端不返回（极端情况），设置超时兜底
            var abortedRequestId = activeRequestId;
            setTimeout(function() {
                if (activeRequestId === abortedRequestId) {
                    finishPendingRequest(abortedRequestId);
                    renderMessages();
                }
            }, 3000);
        }

        function regenerateMessage() {
            if (isThinking) return;
            if (messages.length < 2) return;

            // 找到最后一条用户消息（确保存在）
            var lastUserMsg = null;
            for (var i = messages.length - 1; i >= 0; i--) {
                if (messages[i].role === 'user') {
                    lastUserMsg = messages[i];
                    break;
                }
            }
            if (!lastUserMsg) return;

            // 标记最后一条 AI 消息为待替换（不立即删除，等收到新回复时替换）
