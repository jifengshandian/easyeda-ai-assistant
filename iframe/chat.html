            for (var j = messages.length - 1; j >= 0; j--) {
                if (messages[j].role === 'ai' && !messages[j].transient) {
                    messages.splice(j, 1);
                    break;
                }
            }

            var requestId = generateUUID();
            activeRequestId = requestId;

            setStatus('thinking', 'AI 正在思考...');
            isThinking = true;
            updateSendButton();
            renderMessages();

            pendingRequests[requestId] = {
                sessionId: currentSessionId,
                timestamp: Date.now()
            };

            publishMessage('ai-chat/regenerate-request', {
                requestId: requestId,
                sessionId: currentSessionId
            });
        }

        function finishPendingRequest(requestId) {
            // 只有当前活跃请求才清理全局状态
            if (activeRequestId === requestId) {
                activeRequestId = null;
                isThinking = false;
                setStatus('ready', '就绪');
                updateSendButton();
            }
            // 清理 pendingRequests
            delete pendingRequests[requestId];
        }

        function updateSendButton() {
            if (isThinking) {
                sendBtn.classList.add('generating');
                sendBtn.innerHTML = '&#9632;'; // 方块图标
                sendBtn.title = '停止生成';
            } else {
                sendBtn.classList.remove('generating');
                sendBtn.innerHTML = '&#10148;'; // 发送图标
                sendBtn.title = '发送';
            }
        }

        // ============ 渲染 ============

        function renderMessages() {
            var emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            messagesContainer.innerHTML = '';
            messages.forEach(function(msg) {
                messagesContainer.appendChild(createMessageElement(msg));
            });

            if (isThinking && !hasStreamingMessage()) {
                var el = document.createElement('div');
                el.className = 'message ai';
                var avatarDiv = document.createElement('div');
                avatarDiv.className = 'message-avatar';
                avatarDiv.textContent = 'AI';
                var contentDiv = document.createElement('div');
                contentDiv.className = 'message-content typing-indicator';
                contentDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
                el.appendChild(avatarDiv);
                el.appendChild(contentDiv);
                messagesContainer.appendChild(el);
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hasStreamingMessage() {
            for (var i = messages.length - 1; i >= 0; i--) {
                if (messages[i].status === 'streaming') return true;
            }
            return false;
        }

        /**
         * 创建消息 DOM 元素（支持 Block 架构）
         */
        function createMessageElement(msg) {
            var el = document.createElement('div');
            el.className = 'message ' + msg.role;
            el.id = msg.id;

            var avatarDiv = document.createElement('div');
            avatarDiv.className = 'message-avatar';
            avatarDiv.textContent = msg.role === 'user' ? 'U' : 'AI';

            var bodyDiv = document.createElement('div');
            bodyDiv.className = 'message-body';

            if (msg.blocks && msg.blocks.length > 0) {
                // 按类型排序：thinking block 始终在 text block 前面
                var sortedBlocks = msg.blocks.slice().sort(function(a, b) {
                    var order = { 'thinking': 0, 'tool': 1, 'text': 2, 'error': 3 };
                    var aOrder = order[a.type] !== undefined ? order[a.type] : 99;
                    var bOrder = order[b.type] !== undefined ? order[b.type] : 99;

                    // 调试：记录排序比较
                    if (aOrder === 99 || bOrder === 99) {
                        addDebugLog('warn', 'blocks 排序 - 未知类型', {
                            aType: a.type,
                            bType: b.type,
                            aOrder: aOrder,
                            bOrder: bOrder
                        });
                    }

                    return aOrder - bOrder;
                });

                // 调试日志：检查排序结果
                addDebugLog('info', 'renderMessages - blocks 排序', {
                    originalOrder: msg.blocks.map(function(b) { return b.type; }),
                    sortedOrder: sortedBlocks.map(function(b) { return b.type; }),
                    blockCount: sortedBlocks.length
                });

                for (var i = 0; i < sortedBlocks.length; i++) {
                    var block = sortedBlocks[i];
                    if (block.type === 'thinking') {
                        bodyDiv.appendChild(createThinkingBlockElement(block));
                    } else if (block.type === 'tool') {
                        bodyDiv.appendChild(createToolBlockElement(block));
                    } else if (block.type === 'text') {
                        bodyDiv.appendChild(createTextBlockElement(block, msg.role));
                    } else if (block.type === 'error') {
                        bodyDiv.appendChild(createErrorBlockElement(block));
                    }
                }
            } else if (msg.content) {
                // 兼容旧格式
                bodyDiv.appendChild(createTextBlockElement({
                    id: msg.id + '-text',
                    type: 'text',
                    content: msg.content,
                    status: 'success'
                }, msg.role));
            }

            // 添加操作栏（仅 AI 消息且非错误且非历史会话）
            if (msg.role === 'ai' && !msg.blocks.some(function(b) { return b.type === 'error'; }) && !msg.transient) {
                var actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';

                // 复制按钮
                var copyBtn = document.createElement('button');
                copyBtn.className = 'action-btn';
                copyBtn.innerHTML = '&#128203; 复制';
                copyBtn.title = '复制内容';
                copyBtn.addEventListener('click', function() {
                    var textContent = '';
                    for (var j = 0; j < msg.blocks.length; j++) {
                        if (msg.blocks[j].type === 'text') {
                            textContent += msg.blocks[j].content;
                        }
                    }
                    copyToClipboard(textContent);
                });
                actionsDiv.appendChild(copyBtn);

                // 重新生成按钮（仅最后一条 AI 消息且当前会话有效）
                if (messages[messages.length - 1] === msg && currentSessionId && !isThinking) {
                    var regenBtn = document.createElement('button');
                    regenBtn.className = 'action-btn';
                    regenBtn.innerHTML = '&#8635; 重新生成';
                    regenBtn.title = '重新生成回复';
                    regenBtn.addEventListener('click', regenerateMessage);
                    actionsDiv.appendChild(regenBtn);
                }

                bodyDiv.appendChild(actionsDiv);
            }

            // 图片
            if (msg.images && msg.images.length > 0) {
                var imagesDiv = document.createElement('div');
                imagesDiv.className = 'message-images';
                msg.images.forEach(function(img) {
                    var imgEl = document.createElement('img');
                    imgEl.className = 'message-image';
                    if (img.data && img.data.indexOf('data:image/') === 0) {
                        imgEl.src = img.data;
                    }
                    imgEl.alt = img.name || '';
                    imagesDiv.appendChild(imgEl);
                });
                bodyDiv.appendChild(imagesDiv);
            } else if (msg.imageCount && msg.imageCount > 0) {
                var placeholderDiv = document.createElement('div');
                placeholderDiv.className = 'message-images';
                placeholderDiv.style.color = 'var(--text-secondary)';
                placeholderDiv.style.fontStyle = 'italic';
                placeholderDiv.textContent = '[' + msg.imageCount + ' 张图片]';
                bodyDiv.appendChild(placeholderDiv);
            }

            el.appendChild(avatarDiv);
            el.appendChild(bodyDiv);

            // 绑定引用点击事件
            el.querySelectorAll('.ref-tag').forEach(function(tag) {
                tag.addEventListener('click', function() { locateReference(tag.dataset.ref); });
            });

            return el;
        }

        /**
         * 创建 ThinkingBlock DOM 元素
         */
        function createThinkingBlockElement(block) {
            var container = document.createElement('div');
            container.className = 'thinking-container';
            container.id = block.id;
            if (block.status === 'streaming') {
                container.className += ' streaming expanded';
            }

            var header = document.createElement('div');
            header.className = 'thinking-header';

            var icon = document.createElement('span');
            icon.className = 'thinking-toggle-icon';
            icon.textContent = '\u25B6';

            var statusSpan = document.createElement('span');
            statusSpan.className = 'thinking-status-text';
            if (block.status === 'streaming') {
                statusSpan.textContent = '思考中...';
            } else if (block.status === 'paused') {
                statusSpan.innerHTML = '<span class="status-paused">已停止思考</span>';
            } else {
                // 由于后端一次性发送所有事件，时间计算不准确，改为固定文案
                statusSpan.textContent = 'AI已深度思考';
            }

            // 复制思考内容按钮
            var copyBtn = document.createElement('button');
            copyBtn.className = 'thinking-copy-btn';
            copyBtn.textContent = '复制';
            copyBtn.title = '复制思考内容';
            copyBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                copyToClipboard(block.content || '');
            });

            header.appendChild(icon);
            header.appendChild(statusSpan);
            if (block.content && block.status !== 'streaming') {
                header.appendChild(copyBtn);
            }

            header.addEventListener('click', function() {
                var isExpanded = container.className.indexOf('expanded') !== -1;
                if (isExpanded) {
                    container.className = container.className.replace(' expanded', '');
                } else {
                    container.className += ' expanded';
                }
            });

            var contentDiv = document.createElement('div');
            contentDiv.className = 'thinking-content';
            contentDiv.textContent = block.content || '';

            container.appendChild(header);
            container.appendChild(contentDiv);
            return container;
        }

        function getToolStatusText(status) {
            switch (status) {
                case 'pending': return '待执行';
                case 'running': return '执行中';
                case 'success': return '已完成';
                case 'error': return '失败';
                case 'skipped': return '已跳过';
                default: return '未知';
            }
        }

        function createToolBlockElement(block) {
            var card = document.createElement('div');
            card.className = 'tool-container';
            card.id = block.id;
            if (block.status === 'streaming') card.className += ' streaming';
            if (block.status === 'error') card.className += ' error';

            var header = document.createElement('div');
            header.className = 'tool-header';

            var icon = document.createElement('span');
            icon.className = 'tool-toggle-icon';
            icon.textContent = '\u25B6';

            var title = document.createElement('span');
            title.className = 'tool-title';
            if (block.status === 'streaming') {
                title.textContent = '工具调用中...';
            } else if (block.status === 'error') {
                title.textContent = '工具调用完成（含错误）';
            } else {
                title.textContent = '工具调用完成';
            }

            header.appendChild(icon);
            header.appendChild(title);

            header.addEventListener('click', function() {
                var isExpanded = card.className.indexOf('expanded') !== -1;
                if (isExpanded) {
                    card.className = card.className.replace(' expanded', '');
                } else {
                    card.className += ' expanded';
                }
            });

            card.appendChild(header);

            var content = document.createElement('div');
            content.className = 'tool-content';

            var entries = Array.isArray(block.entries) ? block.entries : [];
            if (entries.length === 0) {
                var empty = document.createElement('div');
                empty.style.padding = '8px';
                empty.style.color = 'var(--text-secondary)';
                empty.textContent = '暂无工具调用记录';
                content.appendChild(empty);
            } else {
                for (var i = 0; i < entries.length; i++) {
                    var entry = entries[i];
                    var item = document.createElement('div');
                    item.className = 'tool-entry';
                    if (entry.status === 'error') item.className += ' error';

                    var entryName = document.createElement('div');
                    entryName.className = 'tool-entry-name';
                    entryName.textContent = (entry.toolName || '未知工具') + ' - ' + getToolStatusText(entry.status || 'success');

                    item.appendChild(entryName);

                    if (entry.detail) {
                        var detail = document.createElement('div');
                        detail.className = 'tool-entry-detail';
                        detail.textContent = entry.detail;
                        item.appendChild(detail);
                    }

                    var resultText = entry.error || entry.resultPreview;
                    if (resultText) {
                        var resultDiv = document.createElement('div');
                        resultDiv.className = 'tool-entry-result';
                        resultDiv.textContent = resultText;
                        item.appendChild(resultDiv);
                    }

                    content.appendChild(item);
                }
            }

            card.appendChild(content);
            return card;
        }

        /**
         * 创建 TextBlock DOM 元素
         */
        function createTextBlockElement(block, role) {
            var div = document.createElement('div');
            div.id = block.id;
            div.className = 'message-content';
            if (role === 'user') {
                div.style.background = 'var(--msg-user-bg)';
                div.style.color = 'var(--msg-user-text)';
            }
            if (block.status === 'streaming') {
                div.className += ' block-streaming';
            }

            if (block.status === 'streaming') {
                // 流式阶段：轻渲染
                div.textContent = block.content || '';
            } else {
                // 完成阶段：全量渲染
                addDebugLog('info', '[createTextBlockElement] 调用 parseMarkdown', {
                    blockId: block.id,
                    status: block.status,
                    role: role,
                    contentLength: block.content ? block.content.length : 0,
                    contentPreview: block.content ? block.content.substring(0, 100) : ''
                });
                var html = parseMarkdown(block.content || '');
                div.innerHTML = html;
                highlightReferencesDOM(div);
            }

            return div;
        }

        /**
         * 创建错误 Block DOM 元素
         */
        function createErrorBlockElement(block) {
            var card = document.createElement('div');
            card.className = 'error-message-card';
            card.id = block.id;

            var header = document.createElement('div');
            header.className = 'error-header';
            header.innerHTML = '&#9888; ' + escapeHtml(block.content || '未知错误');
            if (block.errorCode) {
                var codeSpan = document.createElement('span');
                codeSpan.className = 'error-code';
                codeSpan.textContent = ' (' + block.errorCode + ')';
                header.appendChild(codeSpan);
            }
            card.appendChild(header);

            if (block.errorDetails) {
                var detailsBtn = document.createElement('button');
                detailsBtn.className = 'error-details-btn';
                detailsBtn.textContent = '查看详情';
                detailsBtn.addEventListener('click', function() {
                    showErrorDetails(block.errorDetails);
                });
                card.appendChild(detailsBtn);
            }

            return card;
        }

        // ============ Markdown / 工具函数 ============

        /**
         * 解析 Markdown 文本为安全 HTML
         * 使用 marked.js 解析 + DOMPurify 净化 XSS + highlight.js 代码高亮
         * 降级：如果 CDN 库未加载，使用简单正则替换
         */
        function parseMarkdown(text) {
            // 调试日志：记录输入和库加载状态
            addDebugLog('info', '[Markdown] 开始解析', {
                textLength: text ? text.length : 0,
                textPreview: text ? text.substring(0, 100) : '',
                markedLoaded: typeof marked !== 'undefined',
                DOMPurifyLoaded: typeof DOMPurify !== 'undefined',
                markedFootnoteLoaded: typeof markedFootnote !== 'undefined',
                hljsLoaded: typeof hljs !== 'undefined'
            });

            if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
                try {
                    // 创建 marked 实例并配置扩展（只配置一次）
                    if (!window._markedInstance) {
                        addDebugLog('info', '[Markdown] 创建 marked 实例');
                        window._markedInstance = new marked.Marked({
                            breaks: true,
                            gfm: true
                        });

                        // 添加脚注扩展（如果可用）
                        if (typeof markedFootnote !== 'undefined') {
                            addDebugLog('info', '[Markdown] 添加 markedFootnote 扩展');
                            window._markedInstance.use(markedFootnote());
                        }
                    }

                    var rawHtml = window._markedInstance.parse(text);
                    addDebugLog('info', '[Markdown] marked.parse() 完成', {
                        rawHtmlLength: rawHtml.length,
                        rawHtmlPreview: rawHtml.substring(0, 300)
                    });

                    // DOMPurify 配置：保留所有 Markdown 常用标签和属性（包括脚注）
                    var safeHtml = DOMPurify.sanitize(rawHtml, {
                        ALLOWED_TAGS: [
                            'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
                            'p', 'br', 'strong', 'b', 'em', 'i', 'u', 's', 'del', 'mark',
                            'code', 'pre', 'kbd', 'samp', 'var',
                            'a', 'ul', 'ol', 'li', 'blockquote',
                            'table', 'thead', 'tbody', 'tfoot', 'tr', 'th', 'td',
                            'hr', 'span', 'div', 'img',
                            'sup', 'sub', 'abbr', 'cite', 'q', 'dfn', 'time',
                            'input', 'section'  // section 用于脚注
                        ],
                        ALLOWED_ATTR: [
                            'href', 'title', 'target', 'rel', 'class', 'id',
                            'src', 'alt', 'width', 'height',
                            'colspan', 'rowspan', 'start', 'type',
                            'align', 'valign', 'lang', 'dir',
                            'checked', 'disabled',
                            'data-footnote-id', 'data-footnote-backref'  // 脚注属性
                        ],
                        ALLOW_DATA_ATTR: false
                    });
                    addDebugLog('info', '[Markdown] DOMPurify.sanitize() 完成', {
                        safeHtmlLength: safeHtml.length,
                        safeHtmlPreview: safeHtml.substring(0, 300)
                    });

                    // 渲染后使用 highlight.js 高亮代码块
                    if (typeof hljs !== 'undefined') {
                        addDebugLog('info', '[Markdown] 开始代码高亮');
                        // 创建临时容器解析 HTML
                        var tempDiv = document.createElement('div');
                        tempDiv.innerHTML = safeHtml;

                        // 查找所有 code 块并高亮
                        var codeBlocks = tempDiv.querySelectorAll('pre code');
                        addDebugLog('info', '[Markdown] 找到代码块数量: ' + codeBlocks.length);
                        for (var i = 0; i < codeBlocks.length; i++) {
                            var block = codeBlocks[i];
                            // 检测语言（从 class="language-xxx" 中提取）
                            var className = block.className || '';
                            var langMatch = className.match(/language-(\w+)/);
                            var lang = langMatch ? langMatch[1] : '';

                            if (lang && hljs.getLanguage(lang)) {
                                try {
                                    var highlighted = hljs.highlight(block.textContent, { language: lang });
                                    block.innerHTML = highlighted.value;
                                    block.className = 'hljs ' + className;
                                } catch (e) {
                                    addDebugLog('warn', '[Markdown] 代码高亮失败: ' + e.message);
                                }
                            } else {
                                // 自动检测语言
                                try {
                                    var result = hljs.highlightAuto(block.textContent);
                                    block.innerHTML = result.value;
                                    block.className = 'hljs';
                                } catch (e) {
                                    addDebugLog('warn', '[Markdown] 代码自动高亮失败: ' + e.message);
                                }
                            }
                        }

                        addDebugLog('info', '[Markdown] 代码高亮完成，返回结果');
                        return tempDiv.innerHTML;
                    }

                    addDebugLog('info', '[Markdown] 无 hljs，直接返回 safeHtml');
                    return safeHtml;
                } catch (e) {
                    addDebugLog('error', '[Markdown] 解析失败，使用降级渲染', {
                        error: e.message,
                        stack: e.stack,
                        textPreview: text ? text.substring(0, 100) : ''
                    });
                }
            } else {
                addDebugLog('warn', '[Markdown] marked 或 DOMPurify 未加载，使用降级渲染', {
                    markedLoaded: typeof marked !== 'undefined',
                    DOMPurifyLoaded: typeof DOMPurify !== 'undefined'
                });
            }
            // 降级渲染
            addDebugLog('info', '[Markdown] 执行降级渲染');
            var t = escapeHtml(text);
            t = t.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
            t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            t = t.replace(/\n/g, '<br>');
            addDebugLog('info', '[Markdown] 降级渲染完成', {
                resultLength: t.length,
                resultPreview: t.substring(0, 300)
            });
            return t;
        }

        /**
         * 在 DOM 容器中高亮器件位号和网络名引用
         * 使用 TreeWalker 遍历文本节点，跳过 pre/code/a 标签内的内容
         */
        function highlightReferencesDOM(containerElement) {
            if (!containerElement) return;

            var walker = document.createTreeWalker(
                containerElement,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode: function(node) {
                        var parent = node.parentElement;
                        while (parent && parent !== containerElement) {
                            var tag = parent.tagName;
                            if (tag === 'CODE' || tag === 'PRE' || tag === 'A' || tag === 'SPAN') {
                                return NodeFilter.FILTER_REJECT;
                            }
                            parent = parent.parentElement;
                        }
                        return NodeFilter.FILTER_ACCEPT;
                    }
                }
            );

            var textNodes = [];
            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }

            var refPattern = /\b([URCLDQJK]\d+|VCC[_\w]*|GND|NET_[\w]+|V\d+V\d*)\b/g;

            textNodes.forEach(function(node) {
                var text = node.textContent;
                if (!refPattern.test(text)) return;
                refPattern.lastIndex = 0; // 重置正则状态

                var fragment = document.createDocumentFragment();
                var lastIndex = 0;
                var match;

                while ((match = refPattern.exec(text)) !== null) {
                    // 添加匹配之前的文本
                    if (match.index > lastIndex) {
                        fragment.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
                    }

                    // 创建高亮 span
                    var span = document.createElement('span');
                    span.className = 'ref-tag';
                    span.dataset.ref = match[1];
                    span.dataset.type = /^[URCLDQJK]\d+$/.test(match[1]) ? 'component' : 'net';
                    span.textContent = match[1];
                    fragment.appendChild(span);

                    lastIndex = refPattern.lastIndex;
                }

                // 添加剩余文本
                if (lastIndex < text.length) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                }

                node.parentNode.replaceChild(fragment, node);
            });
        }

        /**
         * 字符串级别的引用高亮（仅用于降级场景）
         */
        function highlightReferences(t) {
            t = t.replace(/\b([URCLDQJK]\d+)\b/g, '<span class="ref-tag" data-ref="$1" data-type="component">$1</span>');
            t = t.replace(/\b(VCC[_\w]*|GND|NET_[\w]+|V\d+V\d*)\b/g, '<span class="ref-tag" data-ref="$1" data-type="net">$1</span>');
            return t;
        }

        function locateReference(ref) { publishMessage('ai-chat/locate', { reference: ref }); }

        function escapeHtml(text) {
            var d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text);
            } else {
                // 降级方案
                var textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }
        }

        function showErrorDetails(details) {
            var modal = document.getElementById('error-modal');
            var body = document.getElementById('error-modal-body');
            try {
                body.textContent = JSON.stringify(details, null, 2);
            } catch (e) {
                body.textContent = String(details);
            }
            modal.classList.add('active');
        }

        function closeErrorModal() {
            document.getElementById('error-modal').classList.remove('active');
        }

        // ============ 文件处理 ============

        /**
         * 压缩图片（使用 Canvas API）
         * @param {File} file - 原始图片文件
         * @param {number} maxDimension - 最大尺寸（宽或高）
         * @param {number} quality - JPEG 质量 (0-1)
         * @returns {Promise<string>} - 压缩后的 data URL
         */
        function compressImage(file, maxDimension, quality) {
            return new Promise(function(resolve, reject) {
                var img = new Image();
                img.onload = function() {
                    try {
                        // 计算新尺寸（保持宽高比）
                        var width = img.width;
                        var height = img.height;

                        if (width > maxDimension || height > maxDimension) {
                            var ratio = maxDimension / Math.max(width, height);
                            width = Math.round(width * ratio);
                            height = Math.round(height * ratio);
                        }

                        // 创建 Canvas 并绘制
                        var canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        var ctx = canvas.getContext('2d');
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, width, height);

                        // 输出压缩后的 data URL
                        var compressedDataUrl = canvas.toDataURL('image/jpeg', quality);

                        // 清理
                        URL.revokeObjectURL(img.src);
                        resolve(compressedDataUrl);
                    } catch (error) {
                        reject(error);
                    }
                };
                img.onerror = function() {
                    reject(new Error('图片加载失败'));
                };
                img.src = URL.createObjectURL(file);
            });
        }

        function handleFileSelect(e) {
            var files = Array.from(e.target.files);
            files.forEach(function(file) {
                if (file.type.indexOf('image/') === 0) {
                    // 压缩图片（最大 1024px，质量 0.75）
                    compressImage(file, 1024, 0.75)
                        .then(function(compressedDataUrl) {
                            attachedFiles.push({
                                name: file.name,
                                type: 'image/jpeg', // 压缩后统一为 JPEG
                                data: compressedDataUrl
                            });
                            renderFilePreviews();
                        })
                        .catch(function(error) {
                            console.error('图片压缩失败:', error);
                            showError('图片压缩失败: ' + error.message);
                        });
                }
            });
            fileInput.value = '';
        }

        function renderFilePreviews() {
            filePreviews.innerHTML = '';
            attachedFiles.forEach(function(file, index) {
                var preview = document.createElement('div');
                preview.className = 'file-preview';
                var img = document.createElement('img');
                if (file.data && file.data.indexOf('data:image/') === 0) {
                    img.src = file.data;
                }
                img.alt = file.name || '';
                var btn = document.createElement('button');
                btn.className = 'file-preview-remove';
                btn.textContent = '\u00D7';
                btn.addEventListener('click', function() {
                    attachedFiles.splice(index, 1);
                    renderFilePreviews();
                });
                preview.appendChild(img);
                preview.appendChild(btn);
                filePreviews.appendChild(preview);
            });
        }

        // ============ 配置管理 ============

        function openConfigModal() {
            configModal.classList.add('active');
            publishMessage('ai-chat/request-config', {});
            document.getElementById('cfg-apiurl').value = currentConfig.apiUrl || 'https://api.openai.com/v1/chat/completions';
            document.getElementById('cfg-apikey').value = currentConfig.apiKey || '';
            document.getElementById('cfg-model').value = currentConfig.model || 'gpt-4o';
            document.getElementById('cfg-mcp-enabled').checked = !!currentConfig.mcpEnabled;
            document.getElementById('cfg-mcp-gateway-url').value = currentConfig.mcpGatewayUrl || '';
            document.getElementById('cfg-mcp-gateway-apikey').value = currentConfig.mcpGatewayApiKey || '';
            document.getElementById('cfg-mcp-auto-approve').checked = currentConfig.mcpAutoApprove !== false;
            updateToolsPreviewText();
        }

        function closeConfigModal() { configModal.classList.remove('active'); }

        function saveConfig() {
            var config = {
                provider: 'openai_compatible',
                apiUrl: document.getElementById('cfg-apiurl').value,
                apiKey: document.getElementById('cfg-apikey').value.trim(),
                model: document.getElementById('cfg-model').value,
                mcpEnabled: !!document.getElementById('cfg-mcp-enabled').checked,
                mcpGatewayUrl: document.getElementById('cfg-mcp-gateway-url').value.trim(),
                mcpGatewayApiKey: document.getElementById('cfg-mcp-gateway-apikey').value.trim(),
                mcpAutoApprove: !!document.getElementById('cfg-mcp-auto-approve').checked
            };
            publishMessage('ai-chat/config-update', config);
            publishMessage('ai-chat/request-tools', {
                requestId: 'config-tools-' + Date.now(),
                sessionId: currentSessionId || 'config-refresh'
            });
            closeConfigModal();
        }

        // ============ UI 设置管理 ============

        function openUISettingsModal() {
            var uiSettingsModal = document.getElementById('ui-settings-modal');
            uiSettingsModal.classList.add('active');
            publishMessage('ai-chat/request-config', {});
            document.getElementById('cfg-window-width').value = currentConfig.windowWidth || 960;
            document.getElementById('cfg-window-height').value = currentConfig.windowHeight || 700;
        }

        function closeUISettingsModal() {
            var uiSettingsModal = document.getElementById('ui-settings-modal');
            uiSettingsModal.classList.remove('active');
        }

        function saveUISettings() {
            var widthVal = parseInt(document.getElementById('cfg-window-width').value, 10);
            var heightVal = parseInt(document.getElementById('cfg-window-height').value, 10);
            var config = {
                windowWidth: (widthVal >= 400 && widthVal <= 3840) ? widthVal : 960,
                windowHeight: (heightVal >= 300 && heightVal <= 2160) ? heightVal : 700
            };
            publishMessage('ai-chat/config-update', config);
            closeUISettingsModal();
        }

        function newChat() {
            if (messages.length > 0) flushHistory();
            currentSessionId = null;
            messages = [];
            isThinking = false;
            activeRequestId = null;
            setStatus('ready', '就绪');
            updateSendButton();
            pendingRequests = {};
            publishMessage('ai-chat/clear-session', {});
            messagesContainer.innerHTML =
                '<div class="empty-state">' +
                '<div class="empty-state-icon">&#128172;</div>' +
                '<div class="empty-state-text">AI 原理图助手</div>' +
                '<div class="empty-state-hint">询问原理图问题、请求审查建议或上传截图</div></div>';
            renderHistoryList();
        }

        // ============ 通用工具 ============

        function setStatus(type, text) {
            statusDot.className = 'status-dot ' + type;
            statusText.textContent = text;
        }

        function publishMessage(topic, data) {
            if (typeof eda !== 'undefined' && eda.sys_MessageBus) {
                eda.sys_MessageBus.publishPublic(topic, data);
            } else {
                console.log('[Mock]', topic, data);
            }
        }
    </script>
